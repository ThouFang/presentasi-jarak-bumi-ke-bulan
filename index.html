<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi 3D Jarak & Orbit Bumi-Bulan</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 18px;
            border-radius: 8px;
            pointer-events: none;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { font-size: 16px; margin: 0 0 5px 0; }
        p { font-size: 13px; margin: 0; color: #aaa; }
    </style>
</head>
<body>

    <div id="info">
        <h1>Sistem Bumi & Bulan (3D)</h1>
        <p>Gunakan kursor / sentuhan untuk memutar kamera & scroll untuk zoom.</p>
    </div>

    <!-- Memuat Three.js dan OrbitControls via CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Inisialisasi Scene, Camera, & Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Kontrol Kamera
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. Pencahayaan
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(50, 30, 50);
        scene.add(sunLight);

        // 3. Background Bintang-bintang
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPositions = new Float32Array(starCount * 3);
        for(let i = 0; i < starCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 500;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 0.7});
        const starField = new THREE.Points(starGeometry, starMaterial);
        scene.add(starField);

        // 4. Membuat Objek Bumi (Dengan Tekstur Detail)
        const textureLoader = new THREE.TextureLoader();
        const earthGeometry = new THREE.SphereGeometry(4, 64, 64);
        
        const earthMaterial = new THREE.MeshStandardMaterial({
            map: textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'),
            bumpMap: textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png'),
            bumpScale: 0.05,
            roughness: 0.8
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        scene.add(earth);

        // 5. Membuat Objek Bulan & Garis Orbit
        const moonGeometry = new THREE.SphereGeometry(1.2, 32, 32);
        const moonMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x888888, 
            roughness: 0.9 
        });
        const moon = new THREE.Mesh(moonGeometry, moonMaterial);
        scene.add(moon);

        const orbitRadius = 14;
        const orbitCurve = new THREE.EllipseCurve(0, 0, orbitRadius, orbitRadius);
        const orbitPoints = orbitCurve.getPoints(100);
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints.map(p => new THREE.Vector3(p.x, 0, p.y)));
        const orbitMat = new THREE.LineBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.5 });
        const orbitLine = new THREE.Line(orbitGeo, orbitMat);
        orbitLine.rotation.x = Math.PI / 2;
        scene.add(orbitLine);

        let angle = 0;

        // 6. Loop Animasi
        function animate() {
            requestAnimationFrame(animate);

            earth.rotation.y += 0.005;
            moon.rotation.y += 0.002;

            angle += 0.01;
            moon.position.x = Math.cos(angle) * orbitRadius;
            moon.position.z = Math.sin(angle) * orbitRadius;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsif Layar
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
